<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="head">
            <h1>cruds</h1>
            <p>products management system</p>
        </div>


            <div class="inputs">
                <input type="text" id="title" placeholder="title">
                <div class="price">
                     <input onkeyup="getTotal()" type="number" id="price" placeholder="price">
                     <input onkeyup="getTotal()" type="number" id="taxes" placeholder="taxes">
                     <input onkeyup="getTotal()" type="number" id="ads" placeholder="ads">
                     <input onkeyup="getTotal()" type="number" id="discount" placeholder="discount">
                     <small id="total"></small>
                </div>
                <input type="number" id="count" placeholder="count">
                <input type="text" id="category" placeholder="category">
                <button onclick="createPro()" id="create">Create</button>

            </div>

            <div class="outputs">
                <input onkeyup="searchPro(this.value)" type="text" id="search" placeholder="search">
                <div class="search-block">
                    <button onclick="searchMood(this.id)" id="search-by-title">Search by title</button>
                    <button onclick="searchMood(this.id)" id="search-by-category">Search by category</button>
                </div>
                <div id="delete-all">
                 
                </div>
                <table>
                    <tr>
                        <th>id</th>
                        <th>title</th>
                        <th>price</th>
                        <th>taxes</th>
                        <th>ads</th>
                        <th>discount</th>
                        <th>total</th>
                        <th>category</th>
                        <th>update</th>
                        <th>delete</th>
                    </tr>

                    <tbody id="tbody">
                    </tbody>
                </table>

            </div>
        
    </div>
    <script src="main.js"></script>
</body>
</html>
